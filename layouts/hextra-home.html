{{ define "main" }}
  <div class="hx:mx-auto hx:flex hextra-max-page-width">
    {{ partial "sidebar.html" (dict "context" . "disableSidebar" true) }}
    <main
      id="content"
      class="hx:w-full hx:break-words hx:min-h-[calc(100vh-var(--hextra-navbar-height))] hx:min-w-0 hx:pb-16 hx:pt-6 hx:md:pt-14 hx:px-6 hx:md:px-12"
    >
      {{ partial "custom/page-begin.html" . }}
      <div class="hx:w-full hx:max-w-4xl hx:mx-auto">
        {{ partial "custom/content-begin.html" . }}
        {{ .Content }}
        {{ partial "custom/content-end.html" . }}
      </div>
      {{ partial "custom/page-end.html" . }}
    </main>
  </div>
{{ end }}
