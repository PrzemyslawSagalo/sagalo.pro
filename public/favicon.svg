<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Ambient glow gradients matching banner.svg -->
    <radialGradient id="favPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="favCyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Midnight Base -->
  <rect width="32" height="32" rx="7" fill="#0b0f19"/>

  <!-- Ambient glow layers -->
  <rect width="32" height="32" rx="7" fill="url(#favPurple)"/>
  <rect width="32" height="32" rx="7" fill="url(#favCyan)"/>

  <!-- Subtly frosted border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Concentric Orbital & Architectural Rings from banner.svg -->
  <circle cx="16" cy="16" r="12" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2 1.5"/>
  <circle cx="16" cy="16" r="9" stroke="#6366f1" stroke-width="1.1" stroke-opacity="0.85"/>
  <circle cx="16" cy="16" r="6.2" stroke="#8b5cf6" stroke-width="1.3"/>
  <circle cx="16" cy="16" r="3.8" stroke="#a78bfa" stroke-width="1.2"/>

  <!-- Glowing Core -->
  <circle cx="16" cy="16" r="1.8" fill="#c4b5fd"/>
</svg>
