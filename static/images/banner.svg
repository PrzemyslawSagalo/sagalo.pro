<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Ambient Gradients -->
    <radialGradient id="leftCyan" cx="15%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="centerIndigo" cx="48%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="86%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="72%" cy="95%" r="30%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="strongGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Architectural Grid Pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Midnight Base -->
  <rect width="1584" height="396" fill="#0b0f19" />

  <!-- Ambient Lighting Layers -->
  <rect width="1584" height="396" fill="url(#leftCyan)" />
  <rect width="1584" height="396" fill="url(#centerIndigo)" />
  <rect width="1584" height="396" fill="url(#purpleGlow)" />
  <rect width="1584" height="396" fill="url(#emeraldGlow)" />

  <!-- Grid Overlay -->
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Left Side Constellation Graphic -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.3">
    <line x1="140" y1="120" x2="220" y2="90" />
    <line x1="220" y1="90" x2="320" y2="140" />
    <line x1="140" y1="120" x2="180" y2="260" />
    <line x1="180" y1="260" x2="260" y2="210" />
    <line x1="260" y1="210" x2="360" y2="240" />
    <line x1="320" y1="140" x2="440" y2="180" />
    <line x1="440" y1="180" x2="520" y2="120" />
    <line x1="360" y1="240" x2="480" y2="280" />
    <line x1="440" y1="180" x2="600" y2="220" />
  </g>
  <g fill="#38bdf8">
    <circle cx="140" cy="120" r="3" opacity="0.8" />
    <circle cx="220" cy="90" r="3" opacity="0.8" />
    <circle cx="320" cy="140" r="3.5" opacity="0.9" />
    <circle cx="180" cy="260" r="2.5" opacity="0.7" />
    <circle cx="260" cy="210" r="3" opacity="0.8" />
    <circle cx="360" cy="240" r="3" opacity="0.8" />
    <circle cx="440" cy="180" r="3.5" opacity="0.9" />
    <circle cx="520" cy="120" r="3" opacity="0.8" />
    <circle cx="480" cy="280" r="2.5" opacity="0.7" />
    <circle cx="600" cy="220" r="3" opacity="0.8" />
  </g>

  <!-- Right Side Concentric Rings Graphic -->
  <g transform="translate(1362, 198)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#C4B5FD" stroke-width="2" filter="url(#strongGlow)" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="1.8" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#8B5CF6" stroke-width="1.8" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#863BFF" stroke-width="2" filter="url(#strongGlow)" />
    <circle cx="0" cy="0" r="96" fill="none" stroke="#7C3AED" stroke-width="1.6" opacity="0.9" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="#6D28D9" stroke-width="1.5" opacity="0.75" />
    <circle cx="0" cy="0" r="162" fill="none" stroke="#5B21B6" stroke-width="1.3" opacity="0.6" />
    <circle cx="0" cy="0" r="202" fill="none" stroke="#4C1D95" stroke-width="1.1" opacity="0.45" />
    <circle cx="0" cy="0" r="248" fill="none" stroke="#38bdf8" stroke-width="0.9" opacity="0.3" />
    <circle cx="0" cy="0" r="298" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.18" />
    <circle cx="0" cy="0" r="354" fill="none" stroke="#38bdf8" stroke-width="0.7" opacity="0.08" />
    <!-- Glowing core -->
    <circle cx="0" cy="0" r="8" fill="#C4B5FD" filter="url(#strongGlow)" opacity="0.9" />
  </g>
</svg>
